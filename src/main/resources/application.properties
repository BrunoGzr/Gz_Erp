spring.application.name=GzErp
spring.jpa.database=mysql
spring.datasource.url=jdbc:mysql://${DB_URL}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.flyway.enabled=true
logging.level.org.springframework.web=DEBUG
spring.web.error.include-message=always
spring.web.error.include-exception=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.messages.basename=messages
logging.level.org.springframework.context.support=DEBUG
logging.level.org.springframework.web.servlet.i18n=DEBUG
server.port=8989
logging.level.org.springframework.security=DEBUG

