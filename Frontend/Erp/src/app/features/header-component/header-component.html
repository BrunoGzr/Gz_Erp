<header>
  <!-- PERFIL -->
  <div class="user-profile">

    <img class="avatar-img" [src]="profilePicture" alt="Foto de Perfil">

    <div class="user-info">
      <h1 class="user-name">{{ authservice.currentUser()?.name }}</h1>
      <h2 class="company-name">{{ authservice.currentUser()?.companyName }}</h2>
    </div>
  </div>

  <!-- MENU -->
  <nav class="nav-list">
    <a class="nav-btn" routerLink="/dashboard" routerLinkActive="active-link">
      <img src="Icone-home.svg" alt="icone home"> Inicio
    </a>

    <a class="nav-btn" routerLink="/dashboard" routerLinkActive="active-link">
      <img src="produtos-icon.svg" alt="icone Produtos"> Produtos
    </a>

    <a class="nav-btn" routerLink="/estoque" routerLinkActive="active-link">
      <img src="pedidos-icon.svg" alt="icone pedidos"> Pedidos
    </a>

    <a class="nav-btn" routerLink="/Marketplaces" routerLinkActive="active-link">
      <img src="marketplace-icon.svg" alt="icone Marketplaces"> Marketplaces
    </a>

    <a class="nav-btn" routerLink="/equipe" routerLinkActive="active-link">
      <img src="equipe-icon.svg" alt="icone Equipe"> Equipe
    </a>
  </nav>
</header>
