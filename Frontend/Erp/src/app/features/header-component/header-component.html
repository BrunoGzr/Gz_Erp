<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Site</title>
</head>
<body>

<header>
  <div class="User">
    <div class="profile">
      <img [src]="this.profilePicture">
      <h1>{{authservice.currentUser()?.name}}</h1>
      <h2>{{authservice.currentUser()?.companyName}}</h2>
    </div>

  </div>

  <nav>
    <ul>
      <li><a routerLink="/dashboard">Inicio</a></li>
      <li><a routerLink="/dashboard">Produtos</a></li>
      <li><a routerLink="/estoque">Pedidos</a></li>
      <li><a routerLink="/equipe">Marketplaces</a></li>
      <li><a routerLink="/equipe">Equipe</a></li>
    </ul>
  </nav>

  <div>
      <button (click)="doLogout()">
        <i class="loggout-Button"></i>
        <img src="assets/Icone-Sair.svg" alt="Descrição da imagem" width="200" height="200">
      </button>
  </div>

</header>

<router-outlet></router-outlet>

</body>
</html>
