<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Site</title>
</head>
<body>

<header>
  <div class="User">
    <div class="profile">
      <img [src]="this.profilePicture">
      <h1>{{authservice.currentUser()?.email}}</h1>
      <h2>{{authservice.currentUser()?.id}}</h2>
    </div>

  </div>

  <nav>
    <ul>
      <li><a href="/dashboard">Inicio</a></li>
      <li><a routerLink="/dashboard">Pedidos</a></li>
      <li><a routerLink="/estoque">Estoque</a></li>
      <li><a routerLink="/equipe">Equipe</a></li>
    </ul>
  </nav>

  <div>
      <button (click)="doLogout()">
        <i class="loggout-Button"></i>
        <span>Sexo</span>
      </button>
  </div>

</header>

<router-outlet></router-outlet>

</body>
</html>
